<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/login.css">
    <script src="./js/login.js" defer></script>
    <title>Login</title>
</head>
<body>
    <main class="login-container d-flex align-items-center justify-content-center vh-100">

        <form action="" class="login-form p-4 rounded">
            <h1 class="h3 mb-4">Log in</h1>

            <div class="form-group">
                <label for="email">Email</label>
                <input class="form-control" type="email" name="email" id="email" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input class="form-control" type="password" name="password" id="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-block" type="submit">Log in</button>
        </form>

    </main>
</body>
</html>
